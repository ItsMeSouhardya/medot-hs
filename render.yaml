# M2 authentication baseline; add ElevenLabs settings at M4.
services:
  - type: web
    name: medot-hs
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/live
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.1
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: PHARMACY_ALLOWED_USER_IDS
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /pharmacy
