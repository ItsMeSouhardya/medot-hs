# M1 baseline; add Clerk and ElevenLabs settings at their milestones.
services:
  - type: web
    name: medot-hs
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/live
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.1
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
