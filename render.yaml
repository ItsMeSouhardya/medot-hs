# Pharmacy authentication and server-owned multilingual speech.
services:
  - type: web
    name: medot-hs
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/live
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.1
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: PHARMACY_ALLOWED_USER_IDS
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /pharmacy
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_v3
      - key: ELEVENLABS_VOICE_ID_EN
        sync: false
      - key: ELEVENLABS_VOICE_ID_BN
        sync: false
      - key: ELEVENLABS_VOICE_ID_HI
        sync: false
      - key: ELEVENLABS_MAX_GENERATIONS_PER_DAY
        value: "100"
      - key: FIND_DEMO_TOKENS
        sync: false
      - key: SHARING_RATE_LIMIT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://github.com/ItsMeSouhardya/medot-hs
      - key: REMINDER_CRON_SECRET
        sync: false
